<?xml version="1.0" encoding="utf-8"?>
<!-- Simple original SVG logo for Phantasm LTP Monster Editor -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#6b33ff"/>
      <stop offset="100%" stop-color="#2ec4b6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- emblem: stylized shield -->
  <g transform="translate(32,18)" filter="url(#shadow)">
    <path d="M96 0 L176 48 L176 128 Q128 208 96 232 Q64 208 16 128 L16 48 Z" fill="url(#g)"/>
    <path d="M96 16 L160 56 L160 120 Q128 192 96 216 Q64 192 32 120 L32 56 Z" fill-opacity="0.12"/>
    <circle cx="96" cy="96" r="28" fill="#fff" fill-opacity="0.06"/>
  </g>

  <!-- text block -->
  <g transform="translate(32,170)">
    <text x="0" y="0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="28" fill="#222" font-weight="700">Phantasm</text>
    <text x="0" y="28" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="14" fill="#666">LTP Monster Editor</text>
  </g>
</svg>
